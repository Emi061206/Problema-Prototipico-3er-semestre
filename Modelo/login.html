<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agricultores</title>
    <link rel="stylesheet" href="dist/css/app.css">
</head>
<body>
    <main class="pantalla-login">
        <div class="tarjeta-login">
            <h2>Iniciar sesión</h2>
            
            <form action="procesar_login.php" method="POST" id="formulario-login">
                <div class="formulario-grupo">
                    <label for="email">CORREO</label>
                    <input type="email" id="email" name="correo" class="entrada-texto" required>
                </div>
                
                <div class="formulario-grupo">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" class="entrada-texto" required>
                </div>
                
                <div class="formulario-grupo">
                    <button type="submit" class="btn-primario">INICIAR SESIÓN</button>
                </div>
            </form>
        </div>
    </main>

    <script src="dist/js/app.js"></script>
</body>
</html>
